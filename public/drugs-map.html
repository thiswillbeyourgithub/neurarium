<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same scheme opt-out as index.html: js/theme.js keeps it in step with the theme. -->
    <meta name="color-scheme" content="dark" />
    <!-- The drugs map as a page of its own (js/drugs-map-main.js): neurarium's drug
         dataset placed by a PCA of each drug's binding profile, with none of the 3D
         viewer loaded. Served at neurarium.olicorne.org/drugs-map and, through the
         outer reverse proxy, as the whole of drugsmap.olicorne.org (see
         drugs-map/README.md "Hosting"). Every asset is a RELATIVE path from the site
         root, which both addresses share, so nothing here may assume which host it is on.
         SEO strings are static English (a crawler reads the raw HTML); the canonical
         is the dedicated host, so the two addresses count as one page. -->
    <title>DrugsMap: psychiatric drugs by binding profile (neurarium)</title>
    <meta name="description" content="An interactive map of psychiatric and CNS drugs placed by the similarity of their receptor binding profiles (PCA), built from neurarium's sourced dataset." />
    <link rel="canonical" href="https://drugsmap.olicorne.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="neurarium" />
    <meta property="og:title" content="DrugsMap: psychiatric drugs by binding profile" />
    <meta property="og:description" content="Psychiatric and CNS drugs placed by the similarity of their receptor binding profiles, from neurarium's sourced dataset." />
    <meta property="og:url" content="https://drugsmap.olicorne.org/" />
    <meta property="og:image" content="https://drugsmap.olicorne.org/og-drugs-map.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="llms.txt" />
    <!-- Installable as its own app: drugs-map.webmanifest is neurarium's manifest
         with the map's name, id and start_url (`drugs-map`, which the inner Caddyfile
         rewrites to this page on both hosts), sharing the brain icons. -->
    <link rel="manifest" href="drugs-map.webmanifest" />
    <meta name="theme-color" content="#8a5cf0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // The same service worker as the viewer (sw.js precaches this page too), so the
      // map also works offline once visited.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>

    <!-- umami + dev banner config, then the loader (see index.html for why the names
         are generic). A visit is recorded under whichever host served it, so
         drugsmap.olicorne.org shows up as its own hostname in the same umami site. -->
    <script src="app-config.js"></script>
    <script src="js/app-init.js"></script>
    <script src="js/i18n/en.js"></script>
    <script src="js/i18n/fr.js"></script>
    <script src="js/i18n.js"></script>
    <script src="version.js"></script>
    <script type="module" src="js/update-check.js"></script>

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <link rel="stylesheet" href="css/segmented.css" />
    <link rel="stylesheet" href="css/drug-map.css" />
    <link rel="stylesheet" href="css/drugs-map-page.css" />
    <link rel="stylesheet" href="css/banners.css" />
  </head>
  <body class="dmp">
    <!-- Top banner stack, as in index.html: the optional WIP banner (js/dev-banner.js,
         hidden unless DEV=1) and the error banners (js/error-banner.js) write here. -->
    <div id="banners">
      <div id="dev-banner" role="status" aria-live="polite" hidden></div>
    </div>
    <header class="dmp-header">
      <div class="dmp-title-row">
        <h1 class="dmp-title"><span data-i18n="drugmap.title"></span><span class="beta-tag" data-i18n="sim.beta"></span></h1>
        <div class="dmp-title-btns">
        <button type="button" id="toggle-theme" class="panel-hdr-btn panel-theme-btn" aria-label="Theme">
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
          </svg>
        </button>
        <div class="lang-switch dmp-lang" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="fr">FR</button>
        </div>
        </div>
      </div>
      <p class="panel-byline dmp-byline"><span data-i18n-html="common.byline">by <a href="https://olicorne.org/en" target="_blank" rel="noopener noreferrer">Olivier Cornelis</a></span> · <span data-app-version></span></p>
      <!-- The intro (its neurarium link) and the link hrefs are filled by
           js/drugs-map-main.js: the viewer's address depends on the host
           (js/drug-map/site.js), the README (on GitHub, rendered) on the language. -->
      <p class="dmp-intro" id="dmp-intro"></p>
      <nav class="dmp-links">
        <a id="dmp-viewer" href="./" data-i18n="drugmap.page.viewer"></a>
        <a id="dmp-readme" href="https://github.com/thiswillbeyourgithub/neurarium/blob/main/public/drugs-map/README.md" target="_blank" rel="noopener" data-i18n="drugmap.page.readme"></a>
      </nav>
    </header>
    <main class="dmp-main">
      <div id="drugmap-body"><p class="dmp-loading" data-i18n="loading.data"></p></div>
    </main>

    <script src="js/error-banner.js"></script>
    <script src="js/dev-banner.js"></script>
    <script type="module" src="js/drugs-map-main.js"></script>
  </body>
</html>
